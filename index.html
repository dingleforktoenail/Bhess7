<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bhess7</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chess.js -->
    <script src="https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/chess.min.js"></script>
</head>

<body>

    <!-- =========================
         HOME
    ========================== -->

    <div id="homeScreen" class="screen active">

        <div class="logo">
            <span>♟</span> Bhess7
        </div>

        <p class="subtitle">
            A different way to play chess.
        </p>

        <div class="menu">

            <button id="botButton" class="mainButton">
                PLAY VS BOT
            </button>

            <button id="multiplayerButton" class="mainButton">
                MULTIPLAYER
            </button>

        </div>

    </div>


    <!-- =========================
         BOT SETUP
    ========================== -->

    <div id="botScreen" class="screen">

        <button id="botBackButton" class="backButton">
            ← Back
        </button>

        <div class="logo smallLogo">
            <span>♟</span> Bhess7
        </div>

        <h1>Play vs Bot</h1>

        <div class="botSetup">

            <p class="ratingTitle">
                Bot Rating
            </p>

            <div id="eloDisplay" class="eloDisplay">
                1200
            </div>

            <input
                type="range"
                id="eloSlider"
                min="400"
                max="2400"
                step="100"
                value="1200"
            >

            <div class="eloLabels">
                <span>400</span>
                <span>2400</span>
            </div>

            <p id="botDescription" class="botDescription">
                A balanced opponent.
            </p>

            <button id="startBotButton" class="mainButton">
                START GAME
            </button>

        </div>

    </div>


    <!-- =========================
         CHESS GAME
    ========================== -->

    <div id="gameScreen" class="screen gameScreen">

        <div class="gameTopBar">

            <button id="gameBackButton" class="backButton">
                ← Leave Game
            </button>

            <div class="gameTitle">
                <span>♟</span> Bhess7
            </div>

        </div>


        <div class="gameInfo">

            <div>
                <strong>You</strong>
                <span class="whiteDot"></span>
            </div>

            <div id="gameBotRating">
                Bot • 1200
            </div>

        </div>


        <div id="gameStatus" class="gameStatus">
            Your turn
        </div>


        <!-- CHESSBOARD -->

        <div id="chessBoard" class="chessBoard"></div>


        <button
            id="newGameButton"
            class="secondaryButton newGameButton"
        >
            NEW GAME
        </button>

    </div>


    <!-- =========================
         MULTIPLAYER
    ========================== -->

    <div id="multiplayerScreen" class="screen">

        <button id="backButton" class="backButton">
            ← Back
        </button>

        <div class="logo smallLogo">
            <span>♟</span> Bhess7
        </div>

        <h1>Multiplayer</h1>

        <div class="partyOptions">

            <button id="createPartyButton" class="mainButton">
                CREATE A PARTY
            </button>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="joinSection">

                <input
                    type="text"
                    id="joinCodeInput"
                    placeholder="ENTER JOIN CODE"
                    maxlength="6"
                    autocomplete="off"
                >

                <button id="joinPartyButton" class="mainButton">
                    JOIN PARTY
                </button>

            </div>

        </div>

        <p id="message"></p>

    </div>


    <!-- =========================
         PARTY
    ========================== -->

    <div id="partyScreen" class="screen">

        <div class="logo smallLogo">
            <span>♟</span> Bhess7
        </div>

        <h1>Party Created</h1>

        <p class="partyText">
            Give this code to your opponent:
        </p>

        <div id="partyCode" class="partyCode">
            ------
        </div>

        <p class="waitingText">
            Waiting for opponent...
        </p>

        <button id="cancelPartyButton" class="secondaryButton">
            CANCEL
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
