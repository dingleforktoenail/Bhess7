services:
  web:
    image: nginx:alpine
    restart: on-failure
    user: root
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html
    command: ["sh", "-c", "chmod -R 755 /usr/share/nginx/html && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
